<div class="wrapper" [class.nav-open]="sidenav.opened$ | async">
  <div class="sidebar" [class.sidebar-open]="sidenav.opened$ | async">
      <app-sidebar></app-sidebar>
    </div>
    <button
      *ngIf="sidenav.opened$ | async"
      class="sidebar-backdrop"
      type="button"
      aria-label="Fechar menu de navegação"
      (click)="sidenav.close()">
    </button>
    <div class="main-panel">
      <app-navbar></app-navbar>
      <router-outlet></router-outlet>
      <!-- <app-footer></app-footer> -->
    </div>
  </div>
