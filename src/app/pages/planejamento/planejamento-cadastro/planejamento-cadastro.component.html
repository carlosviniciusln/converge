<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">
    <b>{{ titulo }}</b><br /><small>{{ subTitulo }}</small>
  </h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
    <span aria-hidden="true">×</span>
  </button>
</div>
<div class="modal-body">
  <form [formGroup]="form">
    <div class="row">
      <div class="col-md-12">
        <div class="row">
          <div class="col-md-3 pr-0">
            <label for="noCriador">Criado por:</label>
            <input formControlName="noCriador" id="noCriador" readonly type="text" class="form-control" />
          </div>
          <div class="col-md-3 pr-0">
            <label for="dhCadastro">Data de cria&ccedil;&atilde;o:</label>
            <input readonly formControlName="dhCadastro" id="dhCadastro" type="text" class="form-control" />
          </div>
          <div class="col-md-3 pr-0">
            <label for="coContrato">N&#186; Contrato:</label>
            <select *ngIf="tipoModal === 'adicionar'" class="form-control" id="nuContrato" formControlName="nuContrato"
              [ngClass]="{ 'is-invalid': submitted && f.nuContrato.invalid }" (change)="onContratoChange($event)">
              <option value={{null}} selected>Selecione o Contrato</option>
              <option *ngFor="let a of listaContratos" [value]="a.contrato">
                {{ a.contrato }}
              </option>
            </select>
            <select *ngIf="tipoModal !== 'adicionar'" class="form-control" id="nuContrato" formControlName="nuContrato"
              [ngClass]="{ 'is-invalid': submitted && f.nuContrato.invalid }">
              <option value={{null}} selected>Selecione o Contrato</option>
              <option *ngFor="let a of listaContratos" [ngValue]="a.nuContrato">
                {{ a.coContrato }}
              </option>
            </select>
          </div>
          <div class="col-md-3 min-height-59">
            <label for="icServicoContinuo">Servi&ccedil;o Cont&iacute;nuo?</label>
            <div class="row">
              <div class="col-md-2 pr-1">N&atilde;o</div>
              <div class="col-md-2 pl-1 pr-1">
                <mat-slide-toggle formControlName="icServicoContinuo" id="icServicoContinuo"
                  (change)="onIsServicoContinuoChange($event)"></mat-slide-toggle>
              </div>
              <div class="col-md-2 pr-1">Sim</div>
            </div>
          </div>
          <div class="col-md-6 pr-0">
            <label for="deObjeto">Objeto:</label>
            <input formControlName="deObjeto" id="deObjeto" placeholder="Digite..." type="text" class="form-control" />
          </div>
          <div class="col-md-3 pr-0">
            <label for="nuPlanejamentoTipo">Tipo de Planejamento:</label>
            <select class="form-control" id="nuPlanejamentoTipo" formControlName="nuPlanejamentoTipo" [ngClass]="{
                'is-invalid': submitted && f.nuPlanejamentoTipo.invalid
              }">
              <option value="" disabled selected>Selecione o Tipo</option>
              <option *ngFor="let a of listaTiposPlanejamento" [ngValue]="a.nuPlanejamentoTipo">
                {{ a.dePlanejamentoTipo }}
              </option>
            </select>
          </div>
          <div class="col-md-3 pr-0">
            <label for="nuDemandaTipo">Planejado Para:</label>
            <select class="form-control" id="nuDemandaTipo" formControlName="nuDemandaTipo"
              [ngClass]="{ 'is-invalid': submitted && f.nuDemandaTipo.invalid }" (change)="onPlanejadoParaChange()">
              <option value="" disabled selected>
                Selecione o Planejamento
              </option>
              <option *ngFor="let a of listaTiposDemanda" [ngValue]="a.nuDemanda">
                {{ a.deDemanda }}
              </option>
            </select>
          </div>
          <div class="col-md-1 pr-0">
            <label for="nuAno">Exerc&iacute;cio:</label>
            <select class="form-control" id="nuAno" formControlName="nuAno"
              [ngClass]="{ 'is-invalid': submitted && f.nuAno.invalid }">
              <option value="" disabled selected>
                Selecione ano de exerc&iacute;cio
              </option>
              <option *ngFor="let a of listaExercicios" [ngValue]="a.nuOrcamento">
                {{ a.nuAnoOrcamento }}
              </option>
            </select>
          </div>
          <div class="col-md-2 pr-0">
            <label for="nuPlanejamentoStatus">Status:</label>
            <select class="form-control" id="nuPlanejamentoStatus" formControlName="nuPlanejamentoStatus" [ngClass]="{
                'is-invalid': submitted && f.nuPlanejamentoStatus.invalid
              }">
              <option value="" disabled selected>Selecione Status</option>
              <option *ngFor="let a of listaStatusPlanejamento" [ngValue]="a.nuPlanejamentoStatus">
                {{ a.noPlanejamentoStatus }}
              </option>
            </select>
          </div>
          <div class="col-md-3 pr-0">
            <label for="nuObjetivoEstrategicoPdti">Objetivo Estratégico PDTIC:</label>
            <select class="form-control" id="nuObjetivoEstrategicoPdti" formControlName="nuObjetivoEstrategicoPdti"
              [ngClass]="{
                'is-invalid': submitted && f.nuObjetivoEstrategicoPdti.invalid
              }">
              <option value="" disabled selected>
                Selecione Objetivo Estratégico
              </option>
              <option *ngFor="let a of listaObjetivosEstrategicosPdti" [ngValue]="a.nuObjetivoEstrategico">
                {{ a.coObjetivoEstrategico }} - {{ a.deObjetivoEstrategico }}
              </option>
            </select>
          </div>
          <div class="col-md-3 pr-0">
            <label for="nuObjetivoEstrategico">Objetivo Estratégico PEI:</label>
            <select class="form-control" id="nuObjetivoEstrategicoPei" formControlName="nuObjetivoEstrategicoPei"
              [ngClass]="{
                'is-invalid': submitted && f.nuObjetivoEstrategicoPei.invalid
              }">
              <option value="" disabled selected>
                Selecione Objetivo Estratégico PEI
              </option>
              <option *ngFor="let a of listaObjetivosEstrategicosPei" [ngValue]="a.nuObjetivoEstrategico">
                {{ a.coObjetivoEstrategico }} - {{ a.deObjetivoEstrategico }}
              </option>
            </select>
          </div>
          <div class="col-md-3 pr-0">
            <label for="icDigital">Classifica&ccedil;&atilde;o Digital</label>
            <select class="form-control" id="icDigital" formControlName="icDigital"
              [ngClass]="{ 'is-invalid': submitted && f.icDigital.invalid }" (change)="onIsDigitalChange($event)">
              <option value="" disabled selected>
                Selecione a Classifica&ccedil;&atilde;o
              </option>
              <option *ngFor="let a of listaDigital" [ngValue]="a.id">
                {{ a.tipo }}
              </option>
            </select>
          </div>
          <div class="col-md-9 pr-0">
            <label for="deJustificativa">Justificativa para Or&ccedil;amento:</label>
            <input formControlName="deJustificativa" id="deJustificativa" placeholder="Digite..." type="text"
              class="form-control" />
          </div>
          <div class="col-md-3 pr-0">
            <div *ngIf="this.form.controls['icDigital'].value == 1 || this.form.controls['icDigital'].value == 2">
              <label for="nuClassificacaoPlanejamento">Categorias:</label>
              <select class="form-control" id="nuClassificacaoPlanejamento"
                formControlName="nuClassificacaoPlanejamento" [ngClass]="{
                  'is-invalid':
                    submitted && f.nuClassificacaoPlanejamento.invalid
                }"
                [attr.required]="this.form.controls['icDigital'].value == 1 || this.form.controls['icDigital'].value == 2">
                <option value="" disabled selected>Selecione a Categoria</option>
                <option *ngFor="let a of listaClassificacoesPlanejamentoDigitalFiltrada" [ngValue]="a.nuClassificacao">
                  {{ a.noClassificacao }}
                </option>
              </select>
            </div>
          </div>
          <div class="col-md-3 pr-0">
            <label for="nuFilial">Unidade Demandante:</label>
            <select class="form-control" id="nuFilial" formControlName="nuFilial"
              [ngClass]="{ 'is-invalid': submitted && f.nuFilial.invalid }">
              <option value="" disabled selected>
                Selecione Ger&ecirc;ncia Nacional
              </option>
              <option *ngFor="let a of listaFiliais" [ngValue]="a.nuFilial">
                {{ a.coFilial }} - {{ a.sgFilial }}
              </option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <br />
    <div class="row">
      <div class="col-md-6">
        <h4 class="modal-title" id="modal-basic-title">
          <b>Previs&otilde;es de Desembolso</b>
        </h4>
      </div>
      <div class="col-md-6 text-right">
        <button *ngIf="isEditable" type="button" class="btn-sm btn-secondary"
          (click)="adicionarPrevisaoDesembolso(false)">
          <i class="tim-icons icon-simple-add"></i>
        </button>
      </div>
    </div>
    <br />
    <div formArrayName="previsoesDesembolso" *ngFor="
        let previsaoDesembolso of previsoesDesembolso.controls;
        let i = index
      ">
      <div class="row" [formGroupName]="i">
        <div class="row">
          <div class="col-md-4 pr-0">
            <label for="nuRubrica">Rubrica {{ i + 1 }} :</label>
            <select class="form-control" id="nuRubrica" formControlName="nuRubrica" [ngClass]="{
                'is-invalid':
                  submitted && previsaoDesembolso.get('nuRubrica').invalid
              }">
              <option value=" " disabled selected>Selecione Rubrica</option>
              <option *ngFor="let a of listaRubricas" [ngValue]="a.nuRubrica">
                {{ a.coRubrica +' | ' +a.deRubrica }}
              </option>
            </select>
          </div>
          <div class="col-md-3 pr-0">
            <label for="nuPreComprometimento">Nº Pré-comprometimento:</label>
            <input formControlName="nuPreComprometimento" id="nuPreComprometimento" type="number"
              class="form-control" />
          </div>
          <div class="col-md-3 pr-0">
            <label for="nuReserva">Nº da reserva :</label>
            <input type="text" class="form-control" id="nuReserva" formControlName="nuReserva"/>

          </div>
          <div class="col-md-1 pr-0" style="margin-top: 25px;">
            <button *ngIf="isEditable" type="button" class="btn-sm btn-secondary"
              (click)="excluirPrevisaoDesembolso(i)">
              <i class="tim-icons icon-trash-simple"></i>
            </button>
          </div>
          <div class="col-md-12">
            <div class="div-vr-meses">
              <div class="row">
                <div class="col-md-2 pl-[-1] pr-[-1]">
                  <label for="vrJaneiro">Janeiro:</label>

<input type="text" class="form-control" id="vrJaneiro" formControlName="vrJaneiro" mask="separator.2" [thousandSeparator]="'.'"
  [decimalMarker]="','" [dropSpecialCharacters]="false" prefix="R$ " placeholder="R$ 0,00" (blur)="ajustarCentavos(i, 'vrJaneiro')" (keyup)="onValorRubricaChange(i)"/>
                </div>
                <div class="col-md-2 pl-[-1] pr-[-1]">
                  <label for="vrFevereiro">Fevereiro:</label>
                  <input type="text" class="form-control" id="vrFevereiro" formControlName="vrFevereiro" mask="separator.2" [thousandSeparator]="'.'"
  [decimalMarker]="','" [dropSpecialCharacters]="false" prefix="R$ " placeholder="R$ 0,00" (blur)="ajustarCentavos(i, 'vrFevereiro')" (keyup)="onValorRubricaChange(i)"/>
                </div>
                <div class="col-md-2 pl-[-1] pr-[-1]">
                  <label for="vrMarco">Mar&ccedil;o:</label>
                  <input type="text" class="form-control" id="vrMarco" formControlName="vrMarco" mask="separator.2" [thousandSeparator]="'.'"
  [decimalMarker]="','" [dropSpecialCharacters]="false" prefix="R$ " placeholder="R$ 0,00" (blur)="ajustarCentavos(i, 'vrMarco')" (keyup)="onValorRubricaChange(i)"/>
                </div>
                <div class="col-md-2 pl-[-1] pr-[-1]">
                  <label for="vrAbril">Abril:</label>
                 <input type="text" class="form-control" id="vrAbril" formControlName="vrAbril" mask="separator.2" [thousandSeparator]="'.'"
  [decimalMarker]="','" [dropSpecialCharacters]="false" prefix="R$ " placeholder="R$ 0,00" (blur)="ajustarCentavos(i, 'vrAbril')" (keyup)="onValorRubricaChange(i)"/>
                </div>
                <div class="col-md-2 pl-[-1] pr-[-1]">
                  <label for="vrMaio">Maio:</label>
                  <input type="text" class="form-control" id="vrMaio" formControlName="vrMaio" mask="separator.2" [thousandSeparator]="'.'"
  [decimalMarker]="','" [dropSpecialCharacters]="false" prefix="R$ " placeholder="R$ 0,00" (blur)="ajustarCentavos(i, 'vrMaio')" (keyup)="onValorRubricaChange(i)"/>
                </div>
                <div class="col-md-2 pl-[-1] pr-[-1]">
                  <label for="vrJunho">Junho:</label>
                  <input type="text" class="form-control" id="vrJunho" formControlName="vrJunho" mask="separator.2" [thousandSeparator]="'.'"
  [decimalMarker]="','" [dropSpecialCharacters]="false" prefix="R$ " placeholder="R$ 0,00" (blur)="ajustarCentavos(i, 'vrJunho')" (keyup)="onValorRubricaChange(i)"/>
                </div>
              </div>
              <div class="row">
                <div class="col-md-2 pl-[-1] pr-[-1]">
                  <label for="vrJulho">Julho:</label>
                  <input type="text" class="form-control" id="vrJulho" formControlName="vrJulho" mask="separator.2" [thousandSeparator]="'.'"
  [decimalMarker]="','" [dropSpecialCharacters]="false" prefix="R$ " placeholder="R$ 0,00" (blur)="ajustarCentavos(i, 'vrJulho')" (keyup)="onValorRubricaChange(i)"/>
                </div>
                <div class="col-md-2 pl-[-1] pr-[-1]">
                  <label for="vrAgosto">Agosto:</label>
                  <input type="text" class="form-control" id="vrAgosto" formControlName="vrAgosto" mask="separator.2" [thousandSeparator]="'.'"
  [decimalMarker]="','" [dropSpecialCharacters]="false" prefix="R$ " placeholder="R$ 0,00" (blur)="ajustarCentavos(i, 'vrAgosto')" (keyup)="onValorRubricaChange(i)"/>
                </div>
                <div class="col-md-2 pl-[-1] pr-[-1]">
                  <label for="vrSetembro">Setembro:</label>
                  <input type="text" class="form-control" id="vrSetembro" formControlName="vrSetembro" mask="separator.2" [thousandSeparator]="'.'"
  [decimalMarker]="','" [dropSpecialCharacters]="false" prefix="R$ " placeholder="R$ 0,00" (blur)="ajustarCentavos(i, 'vrSetembro')" (keyup)="onValorRubricaChange(i)"/>
                </div>
                <div class="col-md-2 pl-[-1] pr-[-1]">
                  <label for="vrOutubro">Outubro:</label>
                  <input type="text" class="form-control" id="vrOutubro" formControlName="vrOutubro" mask="separator.2" [thousandSeparator]="'.'"
  [decimalMarker]="','" [dropSpecialCharacters]="false" prefix="R$ " placeholder="R$ 0,00" (blur)="ajustarCentavos(i, 'vrOutubro')" (keyup)="onValorRubricaChange(i)"/>
                </div>
                <div class="col-md-2 pl-[-1] pr-[-1]">
                  <label for="vrNovembro">Novembro:</label>
                  <input type="text" class="form-control" id="vrNovembro" formControlName="vrNovembro" mask="separator.2" [thousandSeparator]="'.'"
  [decimalMarker]="','" [dropSpecialCharacters]="false" prefix="R$ " placeholder="R$ 0,00" (blur)="ajustarCentavos(i, 'vrNovembro')" (keyup)="onValorRubricaChange(i)"/>
                </div>
                <div class="col-md-2 pl-[-1] pr-[-1]">
                  <label for="vrDezembro">Dezembro:</label>
                 <input type="text" class="form-control" id="vrDezembro" formControlName="vrDezembro" mask="separator.2" [thousandSeparator]="'.'"
  [decimalMarker]="','" [dropSpecialCharacters]="false" prefix="R$ " placeholder="R$ 0,00" (blur)="ajustarCentavos(i, 'vrDezembro')" (keyup)="onValorRubricaChange(i)"/>
                </div>
              </div>
                  <div class="row">
                    <div class="col-md-9 pr-0 text-right"></div>
                    <div class="col-md-3 pl-[-1] pr-[-1]">
                      <label for="vrTotalRubrica"><b>Total da Rubrica {{ i + 1 }}:</b></label>
                      <input
                        currencyMask
                        id="vrTotalRubrica"
                        formControlName="vrTotalRubrica"
                        placeholder="R$ 0,00"
                        [options]="{ allowNegative: false }"
                        readonly
                      />
                    </div>
                  </div>

            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top: 30px;">
      <div class="col-md-12">
        <div class="row">
          <div class="col-md-10 pr-0">
          </div>
          <div class="col-md-2 pr-0">
            <label for="vrTotalOrcamentoPlanejamento"><b>Total da Contratação:</b></label>
            <input currencyMask id="vrTotalOrcamentoPlanejamento" formControlName="vrTotalOrcamentoPlanejamento"
              placeholder="R$ 0,00" [options]="{ allowNegative: false }"
              style="float: inline-end;margin-right: 10px;" />
          </div>
          <div class="col-md-9"></div>
          <div class="col-md-3">
            <div class="col-md-12 pr-0 text-right" style="padding-top: 26px; padding-left: 0px;">
              <button class="btn-sm btn-default" type="submit" (click)="onSubmit()" style="margin-right: 5px">
                {{ actionButtonLabel }}
              </button>
              <button class="btn-sm btn-warning" *ngIf="isPerfilPrivilegiado" (click)="
               openModalPlanejamento(
                'editar',
                true,
                planejamento.nuPlanejamentoOrcamentario
              )
            " style="margin-right: 5px">
                <i class="tim-icons icon-pencil"></i>
                <span> Editar</span>
              </button>
              <button class="btn-sm btn-danger" *ngIf=" isPerfilPrivilegiado" (click)="Excluir(planejamento)" style="margin-right: 5px">
                <i class="tim-icons icon-trash-simple"></i>
                <span> Excluir</span>
              </button>
            </div>
          </div>

          <div class="col-md-12 pr-0">
            <h4 class="modal-title" id="modal-basic-title" for="deObservacao" style="margin-bottom: 8px;">
              <b>Observa&ccedil;&otilde;es</b>
            </h4>
            <textarea formControlName="deObservacao" id="deObservacao"
              [ngClass]="{ 'is-invalid': submitted && f.deObservacao.invalid }" placeholder="Digite..."
              class="form-control border border-light rounded" rows="4"></textarea>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
