<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">
    <b>{{ titulo }}</b
    ><br /><small>{{ subTitulo }}</small>
  </h4>
  <button
    type="button"
    class="close"
    aria-label="Close"
    (click)="activeModal.dismiss('Cross click')"
  >
    <span aria-hidden="true">×</span>
  </button>
</div>
<div class="modal-body">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-md-6 pr-1">
        <label for="dePeriodo: ">Período:</label>
        <input
          formControlName="dePeriodo"
          id="dePeriodo"
          type="text"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f.dePeriodo.invalid }"
          mask="00/0000"
          [dropSpecialCharacters]="false"
          placeholder="Ex. 00/0000"
        />
        <!-- <div *ngIf="f.dePeriodo.touched && f.dePeriodo.invalid" class="alert alert-danger">
                    <div *ngIf="f.dePeriodo.errors?.required">O Período do pagamento é obrigatório.</div>
                </div>  -->
      </div>
      <div class="col-md-6 pl-1">
        <label for="vrTotal">Valor:</label>
        <input
          formControlName="vrTotal"
          [ngClass]="{ 'is-invalid': submitted && f.vrTotal.invalid }"
          id="vrTotal"
          type="text"
          class="form-control"
          mask="separator.2"
          [allowNegativeNumbers]="true"
          [thousandSeparator]="'.'"
          [decimalMarker]="','"
          prefix="R$ "
          [dropSpecialCharacters]="true"
        />
      </div>
    </div>
    <br />
  </form>
</div>
<div class="modal-footer">
  <button
    class="btn-sm btn-default"
    type="submit"
    (click)="onSubmit()"
    *ngIf="permissions?.Cadastrar ?? permissions?.Alterar ?? false"
  >
    Salvar
  </button>
  <button
    type="button"
    class="btn-sm btn-danger"
    *ngIf="this.nuEmpenho && (permissions?.Excluir ?? false)"
    (click)="excluirEmpenho(this.nuEmpenho)"
  >
    Excluir
  </button>
</div>
