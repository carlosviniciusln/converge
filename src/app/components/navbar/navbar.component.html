<!-- HEADER customizado — replica visual do DSC sem usar dsc-header
     para permitir o uso de logo customizada (assets/img/logo.png) -->
<header id="app-header" class="custom-header">
  <div class="custom-header__row">
    <button id="btn-sandwich" class="custom-header__toggle" type="button" aria-label="Abrir menu de navegação" [attr.aria-expanded]="sidenav.opened$ | async" aria-controls="app-sidebar" (click)="toggleMenu()">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>

    <a href="/" class="custom-header__brand" aria-label="Início">
      <img src="assets/images/logo.png" alt="CONVERGE" class="custom-header__logo" />
    </a>

    <div class="custom-header__separator"></div>
    <span class="custom-header__acronym">CONVERGE</span>
    <span class="custom-header__title"> - Plataforma de Gestão de Contratos</span>
    <div class="custom-header__spacer"></div>

    <form class="custom-header__search" role="search" (ngSubmit)="pesquisar()">
      <i class="fas fa-search custom-header__search-icon" aria-hidden="true"></i>
      <input
        type="text"
        name="headerSearch"
        class="custom-header__search-input"
        placeholder="Pesquisar contrato, unidade ou gerencial..."
        aria-label="Pesquisar contrato, unidade demandante ou visão gerencial"
        [(ngModel)]="searchTerm"
      />
    </form>

    <div class="custom-header__right">
      <div *ngIf="isLoggedIn && currentUser" class="custom-header__user">
        <div class="custom-header__greeting">
          <span class="custom-header__greeting-label">{{ saudacao }},</span>
          <span class="custom-header__username">{{ currentUser?.noUsuario }}!</span>
        </div>
        <span class="custom-header__workunit">{{ currentUser?.noPerfil }}</span>
      </div>

      <button *ngIf="isLoggedIn" id="btn-logout" type="button" class="custom-header__action" (click)="signOut()" aria-label="Sair">
        <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
        <span>Sair</span>
      </button>

      <button *ngIf="!isLoggedIn" id="btn-entrar" type="button" class="custom-header__action" (click)="openModalLogin()" aria-label="Entrar">
        <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
        <span>Entrar</span>
      </button>
    </div>
  </div>

  <div class="custom-header__classification">
    <span class="custom-header__classification-label">Conteúdo</span>
    <span class="custom-header__classification-title">OS DADOS PESSOAIS ESTÃO DE ACORDO COM AS NORMAS DA LGPD</span>
    <span class="custom-header__classification-info">Atualizado em: <strong>{{ dataHoraAtual }}</strong></span>
  </div>
</header>
