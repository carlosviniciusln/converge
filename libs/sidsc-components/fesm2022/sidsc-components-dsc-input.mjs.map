<mat-label class="mat-label"
           [class]="formFieldLabelSize"
           [ngClass]="{
           'error-label': this.ngControl &&
           (this.ngControl.invalid && (ngControl.touched || ngControl.dirty)) &&
           !readOnly
           }">
  {{ label }}
  <span *ngIf="labelHint"
        class="mat-label__hint">{{ labelHint }}</span>
  <mat-icon *ngIf="labelHintTooltip"
            [ngClass]="{'disabled-tooltip': disabled, 'readonly-tooltip': readOnly}"
            [dscTooltip]="labelHintTooltip"
            [dscTooltipDisabled]="disabled || readOnly"
            dscTooltipVariant='highlight'
            dscTooltipPosition="right"
            [ngClass]="getIconClass()">
    info_outline
  </mat-icon>
</mat-label>

<form *ngIf="options.length > 0">
  <mat-form-field cdkMonitorSubtreeFocus
                  [hintLabel]="formFieldHint"
                  [class]="formFieldSize"
                  [ngClass]="formFieldClasses">
    <input matInput
          [type]="isPasswordField && hidePassword ? 'password' : 'text'"
          [placeholder]="placeholder"
          [errorStateMatcher]="matcher"
          [disabled]="disabled"
          [readonly]="readOnly"
          [attr.maxlength]="maxlength"
          [value]="val"
          [formControl]="autocompleteControl"
          (input)="onInput($event)"
          (focus)="isActive = true"
          (blur)="emitValueOn();blur.emit($event)"
          (keydown)="onKeydown($event);keydown.emit($event)"
          [matAutocomplete]="auto"
          #input>
          
          <mat-hint *ngIf="labelHintTooltip"
            [id]="tooltipId"
            class="cdk-visually-hidden">
            {{ labelHintTooltip }}
          </mat-hint>
    
  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onOptionSelected($event)">
    <mat-option *ngFor="let option of filteredOptions" [value]="option">
        {{ option }}
      </mat-option>
    </mat-autocomplete>

    <mat-hint *ngIf="showCharCounter"
              align="end">
              {{ input.value.length }}/{{ maxlength }}
    </mat-hint>
    <mat-error *ngIf='!readOnly'>
      <mat-icon inline="true">warning</mat-icon>
      {{ errorText }}
    </mat-error>
    <button *ngIf="isPasswordField && showIconPassword"
            mat-icon-button
            matSuffix
            disableRipple="true"
            type="button"
            (click)="hidePassword = !hidePassword;onTouched();$event.stopPropagation()"
            [disabled]="disabled || readOnly"
            [attr.aria-label]="hidePassword ? 'Mostrar' : 'Esconder' + ' senha.'"
            [attr.aria-pressed]="hidePassword">
      <mat-icon [ngClass]="getIconClass()">{{hidePassword ? 'visibility' : 'visibility_off'}}</mat-icon>
    </button>
    <button *ngIf="showClearButton && !isPasswordField"
            matSuffix
            mat-icon-button
            disableRipple="true"
            aria-label="Limpar"
            type="button"
            [disabled]="disabled || readOnly"
            (click)="ngControl.reset('');$event.stopPropagation()">
      <mat-icon [ngClass]="getIconClass()">
        <span class="material-symbols-outlined">
          cancel
        </span>
      </mat-icon>
    </button>
    <mat-icon *ngIf="iconPrefix" [ngClass]="getIconClass()"
              matPrefix>
      {{ iconPrefix }}
    </mat-icon>
    <mat-icon *ngIf="iconSuffix && !showClearButton && !isPasswordField" [ngClass]="getIconClass()"
              matSuffix>
      {{ iconSuffix }}
    </mat-icon>
  </mat-form-field>
</form>

<mat-form-field *ngIf="options.length === 0"
  cdkMonitorSubtreeFocus
  [hintLabel]="formFieldHint"
  [class]="formFieldSize"
  [ngClass]="formFieldClasses">

    <input matInput
          [type]="isPasswordField && hidePassword ? 'password' : 'text'"
          [placeholder]="placeholder"
          [suffix]="suffix"
          [mask]="mask"
          [errorStateMatcher]="matcher"
          [disabled]="disabled"
          [readonly]="readOnly"
          [attr.maxlength]="maxlength"
          [(ngModel)]="val"
          (focus)="isActive = true"
          (blur)="emitValueOn();blur.emit($event)"
          (keydown)="onKeydown($event);keydown.emit($event)"
          #input>
        <mat-hint *ngIf="labelHintTooltip"
          [id]="tooltipId"
          class="cdk-visually-hidden">
          {{ labelHintTooltip }}
        </mat-hint>

  <mat-hint *ngIf="showCharCounter"
    align="end">
    {{ input.value.length }}/{{ maxlength }}
  </mat-hint>

  <mat-error *ngIf='!readOnly'>
    <mat-icon inline="true">warning</mat-icon>
      {{ errorText }}
  </mat-error>

  <button *ngIf="isPasswordField && showIconPassword"
          mat-icon-button
          matSuffix
          disableRipple="true"
          type="button"
          (click)="hidePassword = !hidePassword;onTouched();$event.stopPropagation()"
          [disabled]="disabled || readOnly"
          [attr.aria-label]="hidePassword ? 'Mostrar' : 'Esconder' + ' senha.'"
          [attr.aria-pressed]="hidePassword">
    <mat-icon [ngClass]="getIconClass()">{{hidePassword ? 'visibility' : 'visibility_off'}}</mat-icon>
  </button>

  <button *ngIf="showClearButton && !isPasswordField"
          matSuffix
          mat-icon-button
          disableRipple="true"
          aria-label="Limpar"
          type="button"
          [disabled]="disabled || readOnly"
          (click)="ngControl.reset('');$event.stopPropagation()">
    <mat-icon [ngClass]="getIconClass()">
      <span class="material-symbols-outlined">
        cancel
      </span>
    </mat-icon>
  </button>

  <mat-icon *ngIf="iconPrefix" [ngClass]="getIconClass()"
    matPrefix>
    {{ iconPrefix }}
  </mat-icon>
  <mat-icon *ngIf="iconSuffix && !showClearButton && !isPasswordField" [ngClass]="getIconClass()"
   matSuffix>
    {{ iconSuffix }}
  </mat-icon>
</mat-form-field>
