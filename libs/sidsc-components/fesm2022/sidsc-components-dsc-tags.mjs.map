<div 
    class="content" 
    [style.max-width]="maxWidth"
    [ngClass]="[size, getComputedClass(variant)]"
    tabindex="0"
    [attr.aria-label]="label">
    <div class="icon-content">
        <mat-icon *ngIf="icon" class="icon">
            {{ icon }}
        </mat-icon>
    </div>

    <span 
        #labelElement 
        class="label"
        [dscTooltip]="showTooltip ? label : ''" 
        dscTooltipPosition="above">
        {{ label }}
    </span>
</div>
